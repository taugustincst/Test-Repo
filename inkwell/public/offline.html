<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Inkwell</title>
  <meta name="theme-color" content="#0e0e10">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0e0e10; color: #f1ece3; font-family: Inter, system-ui, sans-serif; text-align: center; padding: 24px; }
    .mark { width: 64px; height: 64px; border-radius: 50%; background: #f1ece3; margin: 0 auto 20px; position: relative; }
    .mark::after { content: ""; position: absolute; inset: 16px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #0e0e10; transform: rotate(45deg); }
    h1 { font-family: Georgia, serif; font-weight: 600; margin: 0 0 8px; }
    p { color: #a39d92; max-width: 40ch; margin: 0 auto 22px; }
    button { background: #d4553f; color: #fff; border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <div class="mark" aria-hidden="true"></div>
    <h1>You're offline</h1>
    <p>Inkwell needs a connection to load new work and bookings. Pages you have already opened may still be available.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
