<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inkwell</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e10; color: #f1ece3; font-family: -apple-system, Inter, system-ui, sans-serif; text-align: center; }
    .mark { width: 72px; height: 72px; border-radius: 50%; background: #f1ece3; margin: 0 auto 18px; position: relative; }
    .mark::after { content: ""; position: absolute; inset: 18px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #0e0e10; transform: rotate(45deg); }
    p { color: #a39d92; }
  </style>
</head>
<body>
  <div>
    <div class="mark" aria-hidden="true"></div>
    <h1>Inkwell</h1>
    <p>Loading…<br><small>If this stays here, the app cannot reach the server. Check your connection.</small></p>
  </div>
</body>
</html>
